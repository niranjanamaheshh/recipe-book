{% extends 'navbar.html' %}
{% block nav %}
{% load static %}
        <div class="container mt-5 text-center">
            <h1 class="display-4 fw-bold text-uppercase text-white py-3 px-4 rounded shadow" style="background-color:black">
              Explore Cooking Videos
            </h1>
          </div>
        <div class="container my-5">
            <div class="row">
                {% for i in videos %}
                <div class="col-md-3">
                    <div class="card border border-0">
                        {% if i.video %}
                        <video controls>
                            <source src="{{i.video.url}}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        {% else %}
                        <div class="card img-top rounded-top d-flex justify-content-center align-items-center">
                            <span>No Video Available</span>
                        </div>
                        {% endif %}
                        <div class="card-body text-center">
                            <h5 class="card-title text-success">{{i.title}}</h5>
                            <p class="card-title">{{i.caption}}</p>
                            <a class="stretched-link" href="#"></a>
                        </div>
                        
                            <p class="justify-content-end ms-2">{{i.uploaded_at}}</p>
                            <h5 class="card-title">@{{i.user}}</h5>

                            
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
{% endblock nav %}
